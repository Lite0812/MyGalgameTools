[LooseALD]
Enable=true
PatchDir=patch
EnableLog=true
HookExistsCheck=false
MaxFileSize=268435456

; Auto=先用启发式 signature 扫描定位 System39 ALD 函数，失败时回落 Fixed*Rva。
; Heuristic=只允许启发式扫描；FixedRva=只使用下面的 RVA；Disabled=不安装 ALD hook。
ResolveMode=Auto
StrictHeuristic=false
FixedGetSizeRva=0x31E0
FixedReadRva=0x2E40
FixedExistsRva=0x3380
FixedResizeRva=0x57C20
FixedX35OpenRva=0x4E00
FixedX35ReleaseRva=0x4ED0

; LooseAldHook 不再读取 Pattern_* 配置。
; 它会读取 ALD entry 内嵌的原始文件名，然后直接在 PatchDir 下查同名文件。
; 例：ALD 内为 MAIN.SCO  -> 查 patch\MAIN.SCO
; 例：ALD 内为 Syak_0009.wav -> 查 patch\Syak_0009.wav
; 例：ALD 内为 shak_01013.ogg -> 查 patch\shak_01013.ogg
; CG 额外支持同 stem BMP 便利替换：ALD 内为 cg1207.QNT 时，也会查 patch\cg1207.BMP。
; 如果某些资源读不到内嵌文件名，才会使用 logical id 兜底候选。
