[Martopia]
# 总开关。false 与 Mode=0 都只保留 winmm 代理，不安装引擎钩子。
Enable = true
# 0 关闭；1 资源覆盖；2 全量解包；3 资源覆盖并全量解包。
Mode = 1

[ResourcePatch]
# 支持多个磁盘目录；相对路径以游戏 EXE 所在目录为基准。
# 后配置的目录优先级更高。
PatchFolderCount = 1
PatchFolderName_0 = unencrypted

# 每个目录内先查保留结构的路径，再查平铺 basename。
# 例如内部路径 SS\scenario\start.lua 会依次尝试：
#   unencrypted\SS\scenario\start.lua
#   unencrypted\start.lua
EnableLog = true
# 单个补丁文件最大字节数，默认 256 MiB。
MaxFileSize = 268435456
